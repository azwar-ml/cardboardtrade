<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cardboard Package · Film v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root { --ink:#0e1013; --bone:#f4f1eb; --accent:#e35b2c; --kraft:#b4844f; --stone:#62666d; --line:#dcd7cd; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bone); }
  body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bone); }
  #cam { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .h { position: absolute; font-family: "Inter Tight", sans-serif; font-weight: 500; letter-spacing: -0.045em; line-height: 1.0; text-align: center; white-space: nowrap; color: var(--ink); }
  .w, .l { display: inline-block; will-change: transform, opacity; }
  .mono { font-family: "IBM Plex Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }
  .persp { position: absolute; inset: 0; perspective: 1500px; }

  .box { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .f { position: absolute; left: 50%; top: 50%;
       background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 2px, transparent 2px 7px), linear-gradient(160deg, rgba(255,255,255,.12), rgba(0,0,0,.08));
       box-shadow: inset 0 0 0 1.5px rgba(90,60,30,.2); }
  .f.top::after { content:""; position:absolute; left:50%; top:-1px; bottom:-1px; width:22%; transform:translateX(-50%); background:rgba(140,95,50,.35); }
  .f.front::after { content:""; position:absolute; left:50%; top:0; height:18%; width:22%; transform:translateX(-50%); background:rgba(140,95,50,.35); }

  .sheet { position: absolute; width: 1500px; background: #fff; border-radius: 10px; box-shadow: 0 40px 100px -30px rgba(14,16,19,.35); overflow: hidden; border: 1px solid #ddd8ce; }
  .sheet .bar { height: 54px; background: #1d6f42; color: #fff; display: flex; align-items: center; padding: 0 22px; font-weight: 600; font-size: 20px; }
  .sheet table { border-collapse: collapse; width: 100%; font-size: 21px; }
  .sheet th { background: #e8f2ec; color: #1d6f42; text-align: left; padding: 10px 14px; border: 1px solid #d5dde3; font-weight: 600; }
  .sheet td { padding: 9px 14px; border: 1px solid #e3e6ea; color: #2b3038; white-space: nowrap; }
  .sheet td.r { background: #fbe1d8; color: #a33a14; font-weight: 600; }
  .sheet td.y { background: #fff1c7; color: #6e5300; font-weight: 600; }
  .lens { position: absolute; width: 400px; height: 400px; border-radius: 50%; overflow: hidden; border: 16px solid var(--ink); box-shadow: 0 24px 60px rgba(14,16,19,.35), inset 0 0 40px rgba(255,255,255,.5); background: #fff; }
  .lens .inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .handle { position: absolute; width: 56px; height: 240px; background: var(--ink); border-radius: 12px; }
  .bubble { position: absolute; background: #fff; border-radius: 14px 14px 14px 4px; padding: 18px 26px; font-size: 28px; font-weight: 500; color: var(--ink); box-shadow: 0 18px 40px -14px rgba(14,16,19,.35); white-space: nowrap; border: 1px solid #e3ded4; }
  .bubble small { display: block; font-family: "IBM Plex Mono"; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--stone); margin-bottom: 6px; }

  .tile { position: absolute; border-radius: 22%; background: var(--ink); display: grid; place-items: center; box-shadow: 0 22px 0 #000, 0 50px 80px -20px rgba(14,16,19,.45); }
  .doc { position: absolute; width: 300px; height: 380px; border-radius: 18px; display: grid; place-items: center; font-family: "Inter Tight"; font-weight: 600; letter-spacing: -.02em; font-size: 92px; color: #fff; clip-path: polygon(0 0, 72% 0, 100% 22%, 100% 100%, 0 100%); }
  .doc::after { content: ""; position: absolute; right: 0; top: 0; width: 28%; height: 22%; background: rgba(255,255,255,.35); clip-path: polygon(0 0, 100% 100%, 0 100%); }

  .card { position: absolute; background: #fff; border-radius: 16px; border: 1px solid #e3ded4; box-shadow: 0 40px 90px -30px rgba(14,16,19,.3); }
  .ln { position: absolute; height: 24px; border-radius: 6px; background: #efebe4; }
  .tag { position: absolute; display: inline-flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; border-radius: 8px; padding: 12px 20px; font-size: 25px; font-weight: 500; white-space: nowrap; }
  .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .tag span { font-family: "IBM Plex Mono"; font-size: 17px; text-transform: uppercase; letter-spacing: .05em; color: #9a9da3; }

  .mini { position: absolute; background: #fff; border-radius: 12px; border: 1px solid #e3ded4; box-shadow: 0 24px 50px -24px rgba(14,16,19,.3); padding: 20px 24px; }
  .mini .k { font-family: "IBM Plex Mono"; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--stone); }
  .mini .v { font-family: "Inter Tight"; font-size: 40px; font-weight: 500; letter-spacing: -.03em; color: var(--ink); margin-top: 6px; }

  .offer { position: absolute; width: 380px; background: #fff; border-radius: 12px; border: 1px solid #e3ded4; box-shadow: 0 24px 50px -24px rgba(14,16,19,.3); padding: 22px 26px; }
  .offer .t { font-size: 26px; font-weight: 500; color: var(--ink); }
  .offer .p { font-family: "IBM Plex Mono"; font-size: 18px; color: var(--stone); margin-top: 8px; }
  .offer .city { position: absolute; right: 20px; top: 22px; font-family: "IBM Plex Mono"; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .offer svg { width: 36px; height: 36px; color: var(--kraft); margin-bottom: 10px; }
  .btnx { position: absolute; height: 120px; padding: 0 60px; border-radius: 14px; display: flex; align-items: center; gap: 22px; font-family: "Inter Tight"; font-size: 54px; font-weight: 500; letter-spacing: -.03em; }
</style>
</head>
<body>
<div id="stage"><div id="cam"></div></div>
<script>
// Cardboard Package film v2 — 53 s at 120 BPM. Every cut and word lands on the beat grid (0.5 s).
// Sound cues for these moments live in video/audio.mjs.
const T = 53;
const EASE = "cubic-bezier(.22,1,.36,1)";
const SNAP = "cubic-bezier(.16,1,.3,1)";
const BOUNCE = "cubic-bezier(.34,1.56,.64,1)";
const IN = "cubic-bezier(.6,0,.8,.2)";
const INOUT = "cubic-bezier(.65,0,.35,1)";
const LIN = "linear";
const cam = document.getElementById("cam");
const ACC = "#E35B2C", INK = "#0E1013", BONE = "#F4F1EB";
const markSVG = (body = INK, w = 64) => `<svg viewBox="0 0 64 64" width="${w}" height="${w}" style="overflow:visible"><path class="lid" d="M8 17 20 7h38L46 17z" fill="${ACC}"/><path class="body" d="M8 21h48v9H17v18h39v9H8z" fill="${body}"/></svg>`;

// ---------- timeline helpers: one absolute 0..T timeline; every property is carried through every keyframe ----------
function K(el, keys) {
  const frames = keys.map(([t, p, e]) => ({ ...p, offset: Math.min(1, Math.max(0, t / T)), easing: e || EASE }));
  frames.sort((a, b) => a.offset - b.offset);
  const props = [...new Set(frames.flatMap((f) => Object.keys(f)))].filter((k) => k !== "offset" && k !== "easing");
  for (const k of props) { let last = frames.find((f) => k in f)[k]; for (const f of frames) { if (k in f) last = f[k]; else f[k] = last; } }
  if (frames[0].offset > 0) frames.unshift({ ...frames[0], offset: 0 });
  if (frames[frames.length - 1].offset < 1) frames.push({ ...frames[frames.length - 1], offset: 1 });
  el.animate(frames, { duration: T * 1000, fill: "both" });
}
function el(tag, cls, parent, html, style) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  if (style) Object.assign(n.style, style);
  parent.appendChild(n);
  return n;
}
function scene(a, b, bg) {
  const s = el("div", "scene", cam, null, bg ? { background: bg } : null);
  K(s, [[a - 0.001, { visibility: "hidden" }, LIN], [a, { visibility: "visible" }, LIN], [b, { visibility: "visible" }, LIN], [b + 0.001, { visibility: "hidden" }, LIN]]);
  return s;
}
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// Camera punch: a short scale kick and shake on impacts.
const punches = [];
function punch(t, amt = 1) { punches.push([t, amt]); }
function buildCamera() {
  const keys = [[0, { transform: "translate(0px,0px) scale(1)" }, LIN]];
  punches.sort((a, b) => a[0] - b[0]).forEach(([t, a]) => {
    keys.push([t - 0.001, { transform: "translate(0px,0px) scale(1)" }, LIN]);
    keys.push([t + 0.03, { transform: `translate(${-10 * a}px,${7 * a}px) scale(${1 + 0.035 * a})` }, LIN]);
    keys.push([t + 0.08, { transform: `translate(${8 * a}px,${-6 * a}px) scale(${1 + 0.02 * a})` }, LIN]);
    keys.push([t + 0.14, { transform: `translate(${-4 * a}px,${3 * a}px) scale(${1 + 0.008 * a})` }, LIN]);
    keys.push([t + 0.3, { transform: "translate(0px,0px) scale(1)" }, EASE]);
  });
  K(cam, keys);
}

/** Headline: words rise in (ghost → ink) at the given times; letters scatter out at `out`. <em> = accent. */
function headline(parent, html, size, x, y, times, out, opts = {}) {
  const final = opts.color || INK, ghost = opts.ghost || "#cfc9bf";
  const box = el("div", "h", parent, null, { left: x + "px", top: y + "px", transform: "translate(-50%,-50%)", fontSize: size + "px", color: final });
  let i = 0;
  html.split(/(<br>)/).forEach((part) => {
    if (part === "<br>") { el("br", null, box); return; }
    part.replace(/<em>(.*?)<\/em>|([^<\s]+)/g, (m, em, plain) => {
      (em ? em.split(" ") : [plain]).forEach((word) => {
        const w = el("span", "w", box);
        [...word].forEach((ch) => el("span", "l", w, ch));
        box.appendChild(document.createTextNode(" "));
        const t0 = Array.isArray(times) ? times[Math.min(i, times.length - 1)] : times + i * 0.12;
        const c = em ? ACC : final;
        K(w, [[t0, { opacity: 0, transform: "translateY(70px)", color: em ? ACC : ghost }], [t0 + 0.32, { opacity: 1, transform: "translateY(0px)" }, SNAP], [t0 + 0.55, { color: c }]]);
        if (out != null) [...w.children].forEach((L) => {
          const a = out + rnd() * 0.12, dx = (rnd() - 0.5) * 520, dy = (rnd() - 0.5) * 420, r = (rnd() - 0.5) * 140;
          K(L, [[a, { transform: "translate(0px,0px) rotate(0deg) scale(1)", opacity: 1 }], [a + 0.3, { transform: `translate(${dx}px,${dy}px) rotate(${r}deg) scale(${0.4 + rnd()})`, opacity: 0 }, IN]]);
        });
        i++;
      });
      return m;
    });
  });
  return box;
}

// ---------- kraft boxes ----------
const TONES = { front: "#c39a6c", back: "#b98f62", right: "#ad835a", left: "#a77d52", top: "#d4b083", bottom: "#9e754b" };
function kraftBox(parent, w, h, d) {
  const b = el("div", "box", parent);
  const face = (name, fw, fh, tf) => el("div", "f " + name, b, null, { width: fw + "px", height: fh + "px", transform: `translate(-50%,-50%) ${tf}`, backgroundColor: TONES[name] });
  face("front", w, h, `translateZ(${d / 2}px)`);
  face("back", w, h, `rotateY(180deg) translateZ(${d / 2}px)`);
  face("right", d, h, `rotateY(90deg) translateZ(${w / 2}px)`);
  face("left", d, h, `rotateY(-90deg) translateZ(${w / 2}px)`);
  face("top", w, d, `rotateX(90deg) translateZ(${h / 2}px)`);
  face("bottom", w, d, `rotateX(-90deg) translateZ(${h / 2}px)`);
  return b;
}
function boxField(parent, a, b, n, s) {
  seed = s;
  const P = el("div", "persp", parent);
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + rnd() * 0.5;
    const rx = 660 + rnd() * 300, ry = 380 + rnd() * 160;
    const x = 960 + Math.cos(ang) * rx, y = 540 + Math.sin(ang) * ry;
    const size = 90 + rnd() * 170, z = -200 + rnd() * 400;
    const wrap = el("div", null, P, null, { position: "absolute", left: "0", top: "0", transformStyle: "preserve-3d" });
    const bx = kraftBox(wrap, size, size * (0.55 + rnd() * 0.4), size * (0.6 + rnd() * 0.4));
    const r0 = [rnd() * 360, rnd() * 360, rnd() * 60], spin = [60 + rnd() * 80, 90 + rnd() * 120];
    const dx = Math.cos(ang) * 160, dy = Math.sin(ang) * 90;
    K(wrap, [
      [a, { transform: `translate3d(${x - dx * 1.6}px,${y - dy * 1.6}px,${z - 500}px)`, opacity: 0 }, EASE],
      [a + 0.45, { transform: `translate3d(${x - dx * 0.5}px,${y - dy * 0.5}px,${z - 100}px)`, opacity: 1 }, LIN],
      [b, { transform: `translate3d(${x + dx}px,${y + dy}px,${z + 260}px)`, opacity: 1 }, LIN],
    ]);
    K(bx, [[a, { transform: `rotateX(${r0[0]}deg) rotateY(${r0[1]}deg) rotateZ(${r0[2]}deg)` }, LIN], [b, { transform: `rotateX(${r0[0] + spin[0]}deg) rotateY(${r0[1] + spin[1]}deg) rotateZ(${r0[2]}deg)` }, LIN]]);
  }
  return P;
}
// Whip pans (motion blur comes from the renderer's sub-frames).
function whip(layer, tin, tout, from = 1, to = -1) {
  const keys = [];
  if (tin != null) keys.push([tin, { transform: `translateX(${from * 1920}px)` }], [tin + 0.28, { transform: "translateX(0px)" }, SNAP]);
  if (tout != null) keys.push([tout, { transform: "translateX(0px)" }, IN], [tout + 0.25, { transform: `translateX(${to * 1920}px)` }]);
  K(layer, keys);
}
const boxIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>`;
function buildMark(holder, t0) {
  const lid = holder.querySelector(".lid"), body = holder.querySelector(".body");
  lid.style.transformBox = "fill-box"; lid.style.transformOrigin = "0% 100%";
  K(body, [[t0, { clipPath: "inset(0 0 0 100%)" }], [t0 + 0.3, { clipPath: "inset(0 0 0 0%)" }, SNAP]]);
  K(lid, [[t0, { transform: "translateY(-260px) rotate(-35deg)", opacity: 0 }], [t0 + 0.1, { opacity: 1 }], [t0 + 0.35, { transform: "translateY(0px) rotate(0deg)" }, IN], [t0 + 0.5, { transform: "translateY(-14px) rotate(-6deg)" }, EASE], [t0 + 0.65, { transform: "translateY(0px) rotate(0deg)" }, IN]]);
}
function wordmark(parent, x, y, size, color, tin, tout) {
  const wm = el("div", "h", parent, null, { left: x + "px", top: y + "px", transform: "translateY(-50%)", fontSize: size + "px", textAlign: "left", fontWeight: 600, letterSpacing: "-0.05em", color, clipPath: "inset(-10% -5% -10% -5%)" });
  [..."Cardboard Package"].forEach((ch, i) => {
    const L = el("span", "l", wm, ch === " " ? "&nbsp;" : ch);
    const a = tin + i * 0.022;
    const keys = [[a, { transform: "translateY(110%)", opacity: 0 }], [a + 0.28, { transform: "translateY(0%)", opacity: 1 }, SNAP]];
    if (tout != null) keys.push([tout + i * 0.008, { transform: "translateY(0%)", opacity: 1 }, IN], [tout + 0.2 + i * 0.008, { transform: "translateY(-110%)", opacity: 0 }]);
    K(L, keys);
  });
  return wm;
}

function build(map) {
  // ===== 1 · 0–3.0 · the problem =====
  { const s = scene(0, 3.0);
    boxField(s, 0, 3.0, 10, 11);
    headline(s, "Sick of chasing<br><em>cardboard quotes?</em>", 132, 960, 540, [0.05, 0.3, 0.55, 1.0, 1.5], 2.62); }

  // ===== 2 · 3.0–6.6 · messy sheets and chats, then sucked into the centre =====
  { const s = scene(3.0, 6.6);
    const layer = el("div", null, s, null, { position: "absolute", inset: "0" });
    whip(layer, 3.0, null, 1);
    const push = el("div", null, layer, null, { position: "absolute", inset: "0", transformOrigin: "960px 540px" });
    K(push, [[3.0, { transform: "scale(1) rotate(0deg)", opacity: 1 }, LIN], [6.0, { transform: "scale(1.1) rotate(-1deg)", opacity: 1 }, IN], [6.55, { transform: "scale(.04) rotate(-30deg)", opacity: 0 }]]);
    const rows = [
      ["Al-Noor Packages", "TV Box 55″", "5", "150", "1.48", "21 days", "r:rate revised"], ["Star Corrugation", "TV Box 55″", "5", "?", "1.39", "?", "y:call back"],
      ["Mehran Board", "RSC Carton", "3", "125", "0.62", "14 days", ""], ["Indus Box Co.", "TV Box 55″", "7", "175", "1.92", "30 days", "r:no sample"],
      ["Punjab Cartons", "Fridge Box", "7", "175", "4.10", "?", "y:MOQ?"], ["Crescent Pack", "TV Box 55″", "5", "150", "1.55", "18 days", ""],
      ["Ravi Paper Mills", "Paper Bag", "—", "80", "0.09", "10 days", "r:price old"], ["Sialkot Kraft", "TV Box 55″", "5", "140", "1.31", "?", "y:GSM?"],
      ["Shalimar Corrugated", "AC Outdoor", "7", "175", "3.85", "25 days", ""], ["Lyari Box House", "TV Box 55″", "5", "150", "1.44", "20 days", "r:no reply"],
      ["Hub Packaging", "Pizza 12″", "3", "125", "0.21", "7 days", ""], ["Multan Board", "TV Box 55″", "5", "?", "1.36", "?", "y:awaiting"],
    ];
    const tableHTML = `<div class="bar">Vendor_quotes_FINAL_v7 (2).xlsx</div><table><tr><th>Vendor</th><th>Box</th><th>Ply</th><th>GSM</th><th>USD / pc</th><th>Lead time</th><th>Notes</th></tr>` +
      rows.map((r) => "<tr>" + r.map((c, i) => { if (i === 6 && c) { const [k, v] = c.split(":"); return `<td class="${k}">${v}</td>`; } return `<td class="${c === "?" ? "y" : ""}">${c}</td>`; }).join("") + "</tr>").join("") + "</table>";
    const SX = 210, SY = 150, Z = 1.75, R = 200;
    el("div", "sheet", push, tableHTML, { left: SX + "px", top: SY + "px", transform: "rotate(-1.5deg)" });
    [["Rate revised +8% from Monday", "Vendor · Lahore", 1290, 110, 3.5], ["Which GSM did you want again?", "Vendor · Sialkot", 110, 770, 4.0], ["Sample couriered… last week?", "Vendor · Karachi", 1180, 850, 4.5], ["Sorry sir, capacity full this month", "Vendor · Multan", 80, 100, 5.0], ["Can you resend the drawing?", "Vendor · Faisalabad", 1260, 470, 5.5]].forEach(([txt, who, x, y, t]) => {
      const b = el("div", "bubble", push, `<small>${who}</small>${txt}`, { left: x + "px", top: y + "px" });
      K(b, [[t, { opacity: 0, transform: "scale(.5) translateY(40px)" }], [t + 0.22, { opacity: 1, transform: "scale(1) translateY(0px)" }, BOUNCE]]);
    });
    const lens = el("div", "lens", push);
    const inner = el("div", "sheet inner", lens, tableHTML, { width: "1500px", position: "absolute", borderRadius: "0" });
    const handle = el("div", "handle", push);
    const path = [[3.2, 560, 420], [4.0, 1040, 360], [4.8, 1340, 640], [5.6, 760, 700], [6.2, 640, 520]];
    const pe = "cubic-bezier(.45,0,.55,1)";
    K(lens, path.map(([t, x, y]) => [t, { transform: `translate(${x - R}px,${y - R}px)` }, pe]));
    K(inner, path.map(([t, x, y]) => [t, { transform: `translate(${-(x - SX) * Z + R - 16}px,${-(y - SY) * Z + R - 16}px) scale(${Z})` }, pe]));
    K(handle, path.map(([t, x, y]) => [t, { transform: `translate(${x + 130}px,${y + 160}px) rotate(-40deg)` }, pe])); }

  // ===== 3 · 6.0–8.0 · "Meet" slams in on the drop =====
  { const s = scene(6.0, 8.0);
    const word = el("div", "h", s, null, { left: "960px", top: "540px", transform: "translate(-50%,-50%)", fontSize: "170px" });
    seed = 3;
    [..."Meet"].forEach((ch, i) => {
      const L = el("span", "l", word, ch);
      const sx = (i - 1.5) * 620 + (rnd() - 0.5) * 220, sy = (rnd() - 0.5) * 900, sc = 3 + rnd() * 2, rot = (rnd() - 0.5) * 70;
      K(L, [[6.1, { transform: `translate(${sx}px,${sy}px) scale(${sc}) rotate(${rot}deg)`, opacity: 0, color: "#cfc9bf" }], [6.3, { opacity: 1 }], [7.0, { transform: "translate(0px,0px) scale(1) rotate(0deg)", opacity: 1, color: INK }, IN]]);
    });
    K(word, [[7.0, { transform: "translate(-50%,-50%) scale(1.12)" }], [7.25, { transform: "translate(-50%,-50%) scale(1)" }, SNAP], [7.6, { transform: "translate(-50%,-50%) scale(1)" }, IN], [7.95, { transform: "translate(-50%,-50%) scale(0)" }]]);
    const dot = el("div", null, s, null, { position: "absolute", left: "945px", top: "525px", width: "30px", height: "30px", borderRadius: "50%", background: ACC });
    K(dot, [[7.8, { transform: "scale(0)" }], [8.0, { transform: "scale(1)" }, SNAP]]);
    punch(7.0, 1.6); }

  // ===== 4 · 8.0–10.0 · the mark builds, wordmark types in =====
  { const s = scene(8.0, 10.0);
